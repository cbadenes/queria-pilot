services:

  mongo:
    image: mongo:4.4.6
    command: ["mongod", "--auth"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
      - ./mongo-backups:/backups
    #ports:
    #  - "127.0.0.1:27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      TZ: Europe/Madrid
    networks:
      - queria_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo --host localhost -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  mongo-express:
    image: mongo-express:0.54.0
    #ports:
    #  - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_ADMIN_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_ADMIN_PASSWORD}
      ME_CONFIG_SITE_BASEURL: /database
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - queria_network
    restart: always

  rabbitmq:
    image: rabbitmq:3.8-management
    #ports:
    #  - "127.0.0.1:5672:5672"
    #  - "127.0.0.1:15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Europe/Madrid
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - queria_network
    restart: always

  api:
    build: ./api
    container_name: queria-api
    depends_on:
      - mongo
      - rabbitmq
    env_file:
      - .env   
    ports:
      - "3500:3500"
    networks:
      - queria_network
    command: python app-api.py
    restart: always

  worker:
    build: ./api
    container_name: queria-worker
    depends_on:
      - mongo
      - rabbitmq
    env_file:
      - .env    
    networks:
      - queria_network
    command: python app-worker.py
    restart: always

  web:
    build: ./web
    container_name: queria-web
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - queria_network
    restart: always

  admin:
    build: ./admin
    depends_on:
      - mongo
    env_file:
      - .env    
    volumes:
      - ./admin:/app
    networks:
      - queria_network

networks:
  queria_network:
    driver: bridge

volumes:
  mongo_data:
  rabbitmq_data: